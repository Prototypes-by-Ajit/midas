version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: midas_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: midas_backend
    env_file:
      - .env.backend
    environment:
      REDIS_URL: "redis://redis:6379/0"
      RAG_CHAT_CACHE_ENABLED: "true"

      # ✅ align with your Dockerfile env strategy
      HOME: "/app"
      XDG_CACHE_HOME: "/app/.cache"
      HF_HOME: "/app/.cache/huggingface"
      TRANSFORMERS_CACHE: "/app/.cache/huggingface"
      SENTENCE_TRANSFORMERS_HOME: "/app/.cache/huggingface"
      TORCH_HOME: "/app/.cache/torch"

    volumes:
      - backend_cache:/app/.cache

    ports:
      - "8000:8000"  # ✅ only required API (app.main_agent)

    depends_on:
      - redis
    restart: unless-stopped

    # ✅ no curl dependency
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3).read()"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
        NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL}"
    container_name: midas_frontend
    env_file:
      - .env.frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"

      # Server-side backend URL (Docker network)
      BACKEND_URL: "http://backend:8000"

    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: midas_nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  backend_cache:
