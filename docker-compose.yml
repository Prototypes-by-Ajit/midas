version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: midas_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: midas_backend
    env_file:
      - .env.backend
    environment:
      REDIS_URL: "redis://redis:6379/0"
      RAG_CHAT_CACHE_ENABLED: "true"
      HF_HOME: "/app/.cache/hf"
      TRANSFORMERS_CACHE: "/app/.cache/hf"
      SENTENCE_TRANSFORMERS_HOME: "/app/.cache/st"
      XDG_CACHE_HOME: "/app/.cache"
    volumes:
      - backend_cache:/app/.cache
    ports:
      - "8001:8000"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
        NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL}"
    container_name: midas_frontend
    env_file:
      - .env.frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: midas_nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  backend_cache:
#   - User uploads → Supabase Storage
#   - Chat messages → Supabase Postgres
#   - Vector embeddings → Supabase pgvector
#   - CNN model weights → Baked in Docker image
#   - Logs → stdout/stderr (docker logs)
#   - Temp files → Container /tmp (ephemeral)
