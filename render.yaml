services:
  - type: web
    name: midas-backend
    env: docker
    # There is no Dockerfile.backend. Build the real one with backend/ as context.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: true
    # /healthz is dependency-free. /api/v1/health runs two exact-count Supabase
    # queries per probe, which is real database load on a health check.
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Must be NVIDIA_API_KEY: the alias sync in config.py is one-way (NVIDIA -> GROQ).
      # Setting only GROQ_API_KEY leaves settings.nvidia_api_key None, so every agent
      # silently fails to build its LLM client while the health endpoint still reports
      # "configured" — a backend that passes its health check and cannot generate.
      - key: NVIDIA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hosted
      - key: EMBEDDING_API_URL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_API_MODEL
        sync: false
      - key: BACKEND_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://midas-frontend.onrender.com

  - type: web
    name: midas-frontend
    env: docker
    # Was ./Dockerfile.frontend, a root-context duplicate that had drifted from the
    # real one. Compose, CI, Railway and k8s all build frontend/Dockerfile; this now
    # does too, so there is one frontend image definition instead of two.
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://midas-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://midas-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NODE_ENV
        value: production
