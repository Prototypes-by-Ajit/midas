# Template only — DO NOT put real values here and DO NOT commit a filled copy.
#
# The repo's root .env* files contain live credentials. Create the Secret from
# them imperatively instead, so secrets never enter git:
#
#   kubectl create secret generic midas-backend-secrets -n midas \
#     --from-env-file=.env.backend
#
#   kubectl create secret generic midas-frontend-secrets -n midas \
#     --from-literal=CLERK_SECRET_KEY=... \
#     --from-literal=SUPABASE_SERVICE_KEY=... \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY=...
#
# Note SUPABASE_SERVICE_KEY *and* SUPABASE_SERVICE_ROLE_KEY are both required:
# four route handlers read only the former with no fallback (see CLAUDE.md).
#
# For a managed cluster, prefer External Secrets Operator or the cloud provider's
# secret store CSI driver over static Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: midas-backend-secrets
  namespace: midas
type: Opaque
stringData:
  SUPABASE_URL: "https://REPLACE.supabase.co"
  SUPABASE_SERVICE_KEY: "REPLACE"
  SUPABASE_ANON_KEY: "REPLACE"
  NVIDIA_API_KEY: "REPLACE"
  TAVILY_API_KEY: "REPLACE"
---
apiVersion: v1
kind: Secret
metadata:
  name: midas-frontend-secrets
  namespace: midas
type: Opaque
stringData:
  CLERK_SECRET_KEY: "REPLACE"
  SUPABASE_SERVICE_KEY: "REPLACE"
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE"
