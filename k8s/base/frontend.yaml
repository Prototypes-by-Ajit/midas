apiVersion: apps/v1
kind: Deployment
metadata:
  name: midas-frontend
  namespace: midas
  labels:
    app.kubernetes.io/name: midas-frontend
    app.kubernetes.io/part-of: midas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: midas-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: midas-frontend
        app.kubernetes.io/part-of: midas
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001   # `nextjs` user in the frontend image
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/OWNER/midas-frontend:latest # overridden by kustomize `images:`
          # See backend.yaml: :latest + IfNotPresent silently serves a cached image.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # Next.js standalone writes nothing at runtime
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: midas-frontend-secrets
          env:
            # Server-only: the BFF route handlers call the backend over in-cluster
            # DNS. This must stay non-public — it is never sent to the browser.
            - name: BACKEND_URL
              value: "http://midas-backend:8000"
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Next.js standalone is light; these requests keep it cheap to schedule.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: midas-frontend
  namespace: midas
  labels:
    app.kubernetes.io/name: midas-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: midas-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
