[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.main_agent:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1 --timeout-keep-alive 75"
# /healthz is dependency-free. /api/v1/health runs two exact-count Supabase queries
# per probe, so using it as a healthcheck puts steady load on the database.
healthcheckPath = "/healthz"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
