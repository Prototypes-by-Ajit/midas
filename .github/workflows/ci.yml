name: CI

on:
  push:
    branches:
      - ajit
      - main
  pull_request:

# Least-privilege default; only the image job widens this.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to push. Forked PRs have no secrets.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/midas-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # This step is the real verification: the frontend Dockerfile runs
      # `npm run build`, and next.config.ts disables eslint during builds but
      # NOT TypeScript, so a type error fails the image build.
      #
      # NEXT_PUBLIC_* are inlined into the client bundle at build time, which
      # makes the frontend image environment-specific — see docs/MIDAS-Vault/11 - Infrastructure/Kubernetes Deployment.md.
      # The backend build ignores these args.
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub-hosted layer cache keeps the torch and node_modules layers
          # warm between runs, so a typical build is minutes not tens of minutes.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}

  scan:
    name: Scan backend image
    runs-on: ubuntu-latest
    needs: images
    # Scanning pulls the pushed image, which PR builds deliberately do not produce.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/midas-backend:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report-only for now. Set to '1' to make findings blocking once the
          # existing backlog is triaged.
          exit-code: '0'
